name: Build Flutter Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17' 

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Create missing platform folders
        run: flutter create --platforms android .

      - name: Fix SDK version via Python
        run: |
          python3 -c '
          path = "android/app/build.gradle.kts"
          with open(path, "r") as f:
              content = f.read()
          content = content.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          content = content.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 34")
          content = content.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
          with open(path, "w") as f:
              f.write(content)
          print("Gradle SDK successfully updated to 34!")
          '

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK to Actions Tab
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
