name: Build Flutter Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17' 

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Create missing platform folders
        run: flutter create --platforms android .

      - name: Hardcode SDK 36 in Gradle Build File
        run: |
          # build.gradle.kts ke andar compileSdk aur targetSdk ko zabardasti 36 set karna
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk =.*/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/targetSdk =.*/targetSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/minSdk =.*/minSdk = 24/g' android/app/build.gradle.kts
          fi
          
          # Agar purani gradle file ho toh usay bhi fix kar do
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/targetSdkVersion.*/targetSdkVersion 36/g' android/app/build.gradle
            sed -i 's/minSdkVersion.*/minSdkVersion 24/g' android/app/build.gradle
          fi

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK to Actions Tab
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
