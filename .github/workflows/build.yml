name: Build Flutter Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17' 

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Create missing platform folders
        run: flutter create --platforms android .

      - name: Force Overwrite SDK Versions in Gradle
        run: |
          # build.gradle.kts ke andar direct 36 likhna taake printing plugin ka masla khatam ho jaye
          FILE="android/app/build.gradle.kts"
          if [ -f "$FILE" ]; then
            echo "Modifying $FILE..."
            echo 'android { compileSdk = 36 }' >> $FILE
          fi
          
          # Project level gradle me bhi support add karna
          PROJ_FILE="android/build.gradle"
          if [ -f "$PROJ_FILE" ]; then
            echo "allprojects { repositories { google() mavenCentral() } }" >> $PROJ_FILE
          fi

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK to Actions Tab
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
